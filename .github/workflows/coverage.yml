name: Coverage

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "xtask/**"
      - ".github/workflows/coverage.yml"
      - "codecov.yml"
      - "docs/ci/coverage.md"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "xtask/**"
      - ".github/workflows/coverage.yml"
      - "codecov.yml"
      - "docs/ci/coverage.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  coverage:
    name: Codecov Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'coverage') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci') ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Use larger target dir
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/target" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: ${{ runner.temp }}/target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        env:
          CI: true
          INSTA_UPDATE: "no"
        run: |
          set -euo pipefail
          cargo +nightly llvm-cov clean --workspace
          cargo +nightly llvm-cov \
            --workspace \
            --all-features \
            --tests \
            --branch \
            --ignore-filename-regex "(tests/|bdd/|fuzz/|xtask/)" \
            --no-report
          cargo +nightly llvm-cov report --json --output-path coverage.json
          cargo +nightly llvm-cov report --lcov --output-path lcov.info
          cargo +nightly llvm-cov report --text | tee coverage.txt

      - name: Validate coverage output
        run: |
          set -euo pipefail
          test -s coverage.json
          test -s coverage.txt
          test -s lcov.info

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.txt
            lcov.info
          retention-days: 14
